# Graph-only branch: no MoE and no subject-adaptive components.
dataset_name: ""
subject_ids: "all"
max_epochs: 1000
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
seed: 0
z_scale: True
interaug: True
preprocessing:
  bcic2a: {sfreq: 250, low_cut: null, high_cut: null, start: 0.0, stop: 0.0, batch_size: 48}
  bcic2b: {sfreq: 250, low_cut: null, high_cut: null, start: 0.0, stop: -0.5, batch_size: 48}
  bcic3: {sfreq: 100, low_cut: 0, high_cut: 40, start: 0.0, stop: 0.0, batch_size: 28, channel_selection: true}
  reh_mi: {sfreq: 128, low_cut: 4, high_cut: 50, start: 0.0, stop: 0.0, batch_size: 48}
  hgd: {sfreq: 250, low_cut: 4, high_cut: null, start: 0.0, stop: 0.0, batch_size: 48, remove_artifacts: true}
model: "GraphSpatialTCFormer"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  graph_dropout: 0.1
  use_group_attn: true
  q_heads: 4
  kv_heads: 2
  trans_depth: 5
  trans_dropout: 0.4
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3
  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
